name: Container

# Builds the image for the private, self-hosted deployment (busmap.fruitiex.org).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN != '' }}
      HAS_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY != '' }}
    steps:
      - name: Require the Digitransit API key
        if: env.HAS_API_KEY != 'true'
        run: |
          echo "::warning::Set the VITE_DIGITRANSIT_API_KEY repository secret to publish the self-hosted image."
          exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_API_KEY == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: env.HAS_API_KEY == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.HAS_API_KEY == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: env.HAS_API_KEY == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fruitiex/busmap:main
            ghcr.io/fruitiex/busmap:${{ github.sha }}
          secrets: |
            digitransit_api_key=${{ secrets.VITE_DIGITRANSIT_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to homelab
        if: env.HAS_API_KEY == 'true' && env.HAS_DISPATCH_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {"image": "ghcr.io/fruitiex/busmap", "digest": "${{ steps.build.outputs.digest }}"}
