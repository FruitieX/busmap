name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # All transit HTTP/WebSocket requests are fulfilled by test fixtures.
      # Fork/Renovate PRs do not need production API secrets.
      VITE_DIGITRANSIT_API_KEY: ci-fixture-key

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and verify production build
        run: npm run ci:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and production-browser tests
        run: npm test

      - name: Upload test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    name: Container image
    # Publishing happens in container.yml on master; PRs (incl. Renovate base-image bumps)
    # only verify that the image builds and serves the app.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: busmap:ci
          secrets: |
            digitransit_api_key=ci-fixture-key
          cache-from: type=gha

      - name: Smoke test image
        run: |
          docker run -d --rm -p 8080:8080 --name busmap busmap:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ -o index.html && break; sleep 1; done
          grep -q '<title>busmap</title>' index.html
          curl -fsS http://127.0.0.1:8080/app-version.json
          curl -fsS -o /dev/null http://127.0.0.1:8080/sw.js
